name: Sync Clash Royale data

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install pillow
      - name: Fetch player profile
        run: python .github/scripts/fetch-clash.py
        env:
          CR_API_KEY: ${{ secrets.CR_API_KEY }}
          CR_PLAYER_TAG: '#ULG2CGQLV'
      - name: Commit if changed
        run: |
          git add data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync clash royale data'
          git push
