<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 // QuamOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0d10;
            font-family: 'Press Start 2P', cursive;
            padding: 24px;
        }

        /* CRT scanlines, same as the main site */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0, 0, 0, 0.045) 3px, rgba(0, 0, 0, 0.045) 4px);
            pointer-events: none;
        }

        /* ---- the handheld monitor ---- */
        .monitor {
            background: #b7c0af;
            border: 3px solid #87907f;
            border-radius: 16px;
            padding: 26px 26px 16px;
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35), inset 0 -4px 0 rgba(0, 0, 0, 0.15), 10px 12px 0 rgba(0, 0, 0, 0.45);
            max-width: 560px;
            width: 100%;
        }

        .screen {
            background: #10161a;
            border: 3px solid #202a24;
            border-radius: 8px;
            padding: 28px 26px 20px;
            box-shadow: inset 0 0 26px rgba(0, 0, 0, 0.7);
            background-image: radial-gradient(rgba(200, 230, 210, 0.04) 1px, transparent 1px);
            background-size: 12px 12px;
        }

        .screen-header {
            font-size: 0.55rem;
            color: #c5d6c8;
            letter-spacing: 1.5px;
            margin-bottom: 34px;
            line-height: 1.9;
        }

        .screen-header .err {
            color: #ffd166;
        }

        /* ---- folder desktop ---- */
        .folders {
            display: flex;
            gap: 36px;
            flex-wrap: wrap;
            margin-bottom: 44px;
        }

        .folder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            position: relative;
            padding: 12px 8px 8px;
        }

        .folder-icon {
            width: 52px;
            height: 36px;
            background: #ffd166;
            border: 3px solid #202a24;
            position: relative;
            image-rendering: pixelated;
            box-shadow: inset -5px -5px 0 rgba(0, 0, 0, 0.18);
        }

        .folder-icon::before {
            content: '';
            position: absolute;
            top: -11px;
            left: -3px;
            width: 22px;
            height: 8px;
            background: #ffd166;
            border: 3px solid #202a24;
            border-bottom: none;
        }

        .folder span {
            font-size: 0.5rem;
            color: #c5d6c8;
            letter-spacing: 1px;
        }

        .folder:hover .folder-icon { background: #ffe08a; }
        .folder:hover .folder-icon::before { background: #ffe08a; }
        .folder:hover span { color: #ffffff; }

        /* selection brackets on the first folder, like a cursor hover */
        .folder.selected::before,
        .folder.selected::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
        }
        .folder.selected::before { top: 0; left: 0; border-top: 3px solid #c5d6c8; border-left: 3px solid #c5d6c8; }
        .folder.selected::after { bottom: 0; right: 0; border-bottom: 3px solid #c5d6c8; border-right: 3px solid #c5d6c8; }

        /* pixel cursor arrow, parked mid-screen */
        .cursor-arrow {
            position: absolute;
            width: 22px;
            height: 30px;
            background: #e8f2e9;
            clip-path: polygon(0 0, 0 100%, 32% 76%, 52% 100%, 68% 88%, 48% 66%, 78% 60%);
            filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.6));
            pointer-events: none;
        }

        /* trash, bottom-right */
        .trash-row {
            display: flex;
            justify-content: flex-end;
        }

        .trash {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            opacity: 0.85;
        }

        .trash-icon {
            width: 34px;
            height: 38px;
            background: #8fa192;
            border: 3px solid #202a24;
            border-radius: 0 0 4px 4px;
            position: relative;
            box-shadow: inset -4px 0 0 rgba(0, 0, 0, 0.15);
        }

        .trash-icon::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -6px;
            right: -6px;
            height: 5px;
            background: #8fa192;
            border: 3px solid #202a24;
        }

        .trash span {
            font-size: 0.5rem;
            color: #c5d6c8;
            letter-spacing: 1px;
        }

        .screen-footer {
            margin-top: 30px;
            font-size: 0.45rem;
            color: #5d6f60;
            letter-spacing: 1px;
            line-height: 1.9;
        }

        /* power button on the bezel — press to reboot home */
        .bezel-row {
            display: flex;
            justify-content: center;
            margin-top: 14px;
        }

        .power {
            width: 34px;
            height: 34px;
            border: 3px solid #202a24;
            border-radius: 8px;
            background: #b7c0af;
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35), 0 3px 0 rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.08s ease;
        }

        .power:active { transform: translateY(2px); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35); }

        .power-glyph {
            width: 14px;
            height: 14px;
            border: 3px solid #202a24;
            border-radius: 50%;
            position: relative;
        }

        .power-glyph::before {
            content: '';
            position: absolute;
            top: -7px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 9px;
            background: #202a24;
            box-shadow: 0 0 0 2px #b7c0af;
        }

        @media (max-width: 480px) {
            .folders { gap: 24px; }
            .screen { padding: 22px 16px 16px; }
        }

        @media (prefers-reduced-motion: no-preference) {
            .screen-header .err { animation: errBlink 2.4s step-start infinite; }
            @keyframes errBlink { 0%, 92%, 100% { opacity: 1; } 96% { opacity: 0.25; } }
        }
    </style>
</head>
<body>
    <div class="monitor">
        <div class="screen">
            <p class="screen-header">QuamOS file_manager<br><span class="err">ERROR 404 — FILE NOT FOUND</span></p>

            <div class="folders">
                <a class="folder selected" href="/">
                    <span class="folder-icon"></span>
                    <span>HOME</span>
                </a>
                <a class="folder" href="/#projects">
                    <span class="folder-icon"></span>
                    <span>PROJECTS</span>
                </a>
                <a class="folder" href="/#gallery">
                    <span class="folder-icon"></span>
                    <span>NONAME</span>
                </a>
                <span class="cursor-arrow" style="position: absolute; margin-left: 210px; margin-top: 64px;"></span>
            </div>

            <div class="trash-row">
                <div class="trash">
                    <span class="trash-icon"></span>
                    <span>TRASH</span>
                </div>
            </div>

            <p class="screen-footer">&gt; the page you wanted lives in TRASH now.<br>&gt; open a folder, or press POWER to reboot.</p>
        </div>
        <div class="bezel-row">
            <a class="power" href="/" aria-label="Reboot to home page"><span class="power-glyph"></span></a>
        </div>
    </div>
</body>
</html>
